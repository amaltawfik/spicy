  - title: Measures of Association
    contents:
      - assoc_measures
      - contingency_coef
      - cramer_v
      - gamma_gk
      - goodman_kruskal_tau
      - kendall_tau_b
      - kendall_tau_c
      - lambda_gk
      - phi
      - somers_d
      - uncertainty_coef
      - yule_q
  - title: Summary tables
    contents:
      - table_categorical
      - table_continuous
      - table_continuous_lm
      - table_outcome
      - table_regression
      - table_regression_uv
      - as_structured
      - inline
  - title: Survey-design tables
    desc: >
      The descriptive tables from a `survey::svydesign()` or
      replicate-weight design: design-based estimates, standard errors,
      degrees of freedom and tests, every number delegated to survey
      (Lumley). New in this cycle -- see the API-stability tiers in
      `?spicy`.
    contents:
      - table_continuous_svy
      - table_categorical_svy
  - title: Table styles
    desc: >
      Journal and locale number-formatting themes, each encoding only
      rules sourced from an official document of the institution --
      `?spicy_style` lists every rule with the sentence it comes from.
    contents:
      - spicy_style
  - title: Table language
    desc: >
      The words around the numbers. `options(spicy.language)` sets the
      language of every table label for a document, `options(spicy.labels)`
      overrides one label at a time, and `spicy_labels()` names the keys
      both of them take.
    contents:
      - spicy_labels
  - title: Supported models
    desc: >
      The registry of model classes `table_regression()` supports --
      one function returning the machine-readable list, whose
      documentation page also describes the per-family behaviour
      (inference, robust-variance backends, exponentiate semantics,
      marginal effects, labelled blocks).
    contents:
      - table_regression_models
  - title: Export
    contents:
      - copy_clipboard
  - title: Data
    contents:
      - sochealth
  - title: ASCII helpers
    contents:
      - spicy_print_table
  - title: Advanced S3 methods
    desc: >
      Exported S3 methods. Most users dispatch them implicitly
      (`print(x)`, `broom::tidy(x)`, `as.data.frame(x)`,
      `tibble::as_tibble(x)`). Documented here for direct
      invocation with custom arguments (e.g., `print(...,
      digits = 2)`).
    contents:
      - print.spicy_assoc_detail
      - print.spicy_assoc_table
      - print.spicy_categorical_table
      - print.spicy_continuous_lm_table
      - print.spicy_continuous_table
